<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada — Zuegle</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Inter", sans-serif;
            background: #09090b;
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: absolute; inset: 0; z-index: 0;
            background-image: linear-gradient(rgba(113,113,122,0.12) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(113,113,122,0.12) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
        }
        .glow1 { width: 400px; height: 400px; background: rgba(37,99,235,0.08); top: -100px; left: -100px; }
        .glow2 { width: 300px; height: 300px; background: rgba(6,182,212,0.06); bottom: -50px; right: -50px; }
        .content {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; text-align: center;
            max-width: 480px;
        }
        .icon-wrap {
            width: 96px; height: 96px; border-radius: 24px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 32px;
            box-shadow: 0 8px 32px rgba(37,99,235,0.3);
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .code {
            font-family: "Poppins", sans-serif;
            font-size: 96px; font-weight: 900;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1; margin-bottom: 16px;
        }
        h1 {
            font-family: "Poppins", sans-serif;
            font-size: 24px; font-weight: 700;
            color: white; margin-bottom: 12px;
        }
        p {
            font-size: 16px; color: #71717a;
            line-height: 1.6; margin-bottom: 40px;
        }
        a {
            display: inline-flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; text-decoration: none;
            font-family: "Poppins", sans-serif;
            font-size: 16px; font-weight: 700;
            padding: 16px 36px; border-radius: 14px;
            box-shadow: 0 8px 24px rgba(37,99,235,0.3);
            transition: all 0.2s;
        }
        a:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(37,99,235,0.4); }
        .logo { margin-top: 56px; display: flex; align-items: center; gap: 10px; opacity: 0.3; }
        .logo-ic { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg,#2563eb,#06b6d4); display:flex; align-items:center; justify-content:center; }
        .logo-name { font-family:"Poppins",sans-serif; font-size:18px; font-weight:900; color:white; letter-spacing:1px; }
    </style>
</head>
<body>
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="content">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="52" height="52">
                <path d="M21 11.5C21 16.1944 16.9706 20 12 20C10.6382 20 9.34757 19.721 8.18841 19.2218L3 21L4.7782 15.8116C4.279 14.6524 4 13.3618 4 12C4 7.02944 8.02944 3 13 3C17.9706 3 21 7.02944 21 11.5Z"/>
                <path d="M9 9L15 9L9 15L15 15"/>
            </svg>
        </div>
        <div class="code">404</div>
        <h1>Página não encontrada</h1>
        <p>Parece que esta página se perdeu no chat. Não se preocupa — ainda tens estranhos esperando para conversar!</p>
        <a href="/">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            Voltar ao Chat
        </a>
        <div class="logo">
            <div class="logo-ic">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
                    <path d="M21 11.5C21 16.1944 16.9706 20 12 20C10.6382 20 9.34757 19.721 8.18841 19.2218L3 21L4.7782 15.8116C4.279 14.6524 4 13.3618 4 12C4 7.02944 8.02944 3 13 3C17.9706 3 21 7.02944 21 11.5Z"/>
                    <path d="M9 9L15 9L9 15L15 15"/>
                </svg>
            </div>
            <span class="logo-name">ZUEGLE</span>
        </div>
    </div>
</body>
</html>
